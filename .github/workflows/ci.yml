# Checks main after each merge: the frontend type-check, the Rust unit
# tests and a release build (without installers; those are PLAN.md 8.5) on
# Linux, macOS and Windows, plus the server tests against every dev
# homeserver in Docker on Linux, as `mise run test-server` does locally.
name: CI

# Only when something lands on main (a merged pull request): a full run
# takes a while.
on:
  push:
    branches: [main]

# A newer push to the same branch replaces a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux on 22.04, like the release builds.
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libssl-dev libxdo-dev libayatana-appindicator3-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run check

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Also refuses crates under licenses not accepted in about.toml.
      - name: Third-party licenses are up to date
        if: runner.os == 'Linux'
        run: |
          # The same version as locally: others can word the file differently.
          cargo install --locked cargo-about@0.9.3 --features cli
          node dev/third-party-licenses.mjs --check

      - name: Release build
        run: npm run tauri build -- --no-bundle

  server-tests:
    name: Server tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libssl-dev libxdo-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Every dev server: some tests always use a particular one. Element
      # Web isn't needed.
      - name: Start the dev homeservers
        run: |
          docker compose -f dev/docker-compose.yml \
            --profile no-presence --profile continuwuity --profile mas \
            up -d --wait \
            synapse synapse-no-presence continuwuity \
            synapse-mas mas-db mas dex mas-proxy

      # Build while the servers settle.
      - name: Build the tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-run

      - name: Seed the dev homeservers
        run: |
          python3 dev/seed.py
          AIMTRIX_HS=http://localhost:8009 python3 dev/seed.py
          AIMTRIX_HS=http://localhost:8011 python3 dev/seed.py
          AIMTRIX_HS=http://localhost:8013 python3 dev/seed.py

      - name: Server tests
        run: >
          cargo test --manifest-path src-tauri/Cargo.toml --
          --include-ignored --test-threads=8

      - name: Server logs
        if: failure()
        run: docker compose -f dev/docker-compose.yml --profile no-presence --profile continuwuity --profile mas logs --tail 200
