# Local Matrix test environment for AIMtrix.
#   docker compose -f dev/docker-compose.yml up -d
#   python3 dev/seed.py
# Synapse:     http://localhost:8008
# Element Web: http://localhost:8080  (second client to talk to AIMtrix)
#
# A second Synapse with presence off, for testing that fallback:
#   docker compose -f dev/docker-compose.yml --profile no-presence up -d
#   AIMTRIX_HS=http://localhost:8009 python3 dev/seed.py
# Synapse (no presence): http://localhost:8009
#
# continuwuity, a different server implementation (presence on):
#   docker compose -f dev/docker-compose.yml --profile continuwuity up -d
#   AIMTRIX_HS=http://localhost:8011 python3 dev/seed.py
# continuwuity: http://localhost:8011

services:
  synapse: &synapse
    image: matrixdotorg/synapse:latest
    environment:
      SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
    # Create the signing key on first boot (as root), hand /data to the
    # synapse user (uid 991, the image default), then run normally.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        python -m synapse.app.homeserver -c "$$SYNAPSE_CONFIG_PATH" --generate-keys &&
        chown -R 991:991 /data &&
        exec /start.py
    volumes:
      - ./synapse/homeserver.yaml:/config/homeserver.yaml:ro
      - synapse-data:/data
    ports:
      - "127.0.0.1:8008:8008"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8008/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  synapse-no-presence:
    <<: *synapse
    profiles: [no-presence]
    # A directory: Synapse loads every *.yaml in it, in sorted order.
    environment:
      SYNAPSE_CONFIG_PATH: /config
    volumes:
      - ./synapse/homeserver.yaml:/config/homeserver.yaml:ro
      - ./synapse/no-presence.yaml:/config/no-presence.yaml:ro
      - synapse-no-presence-data:/data
    ports:
      - "127.0.0.1:8009:8008"

  continuwuity:
    image: forgejo.ellis.link/continuwuation/continuwuity:latest
    profiles: [continuwuity]
    environment:
      CONTINUWUITY_SERVER_NAME: localhost
      CONTINUWUITY_DATABASE_PATH: /var/lib/continuwuity
      CONTINUWUITY_ADDRESS: '["0.0.0.0"]'
      CONTINUWUITY_PORT: "8008"
      # No shared-secret admin API like Synapse's; dev/seed.py and the
      # tests register with this token instead.
      CONTINUWUITY_ALLOW_REGISTRATION: "true"
      CONTINUWUITY_REGISTRATION_TOKEN: aimtrix-dev-token
      # The first account is the server admin and needs a one-time token
      # from the log, so make it here (an error on later starts: it exists).
      CONTINUWUITY_ADMIN_EXECUTE: '["users create-user admin aimtrix-test"]'
      CONTINUWUITY_ADMIN_EXECUTE_ERRORS_IGNORE: "true"
      CONTINUWUITY_ALLOW_LOCAL_PRESENCE: "true"
      # Otherwise new users' display names get a flag emoji appended.
      CONTINUWUITY_NEW_USER_DISPLAYNAME_SUFFIX: '""'
      CONTINUWUITY_ALLOW_FEDERATION: "false"
      CONTINUWUITY_TRUSTED_SERVERS: "[]"
    volumes:
      - continuwuity-data:/var/lib/continuwuity
    ports:
      - "127.0.0.1:8011:8008"

  element:
    image: vectorim/element-web:latest
    volumes:
      - ./element/config.json:/app/config.json:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      synapse:
        condition: service_healthy

volumes:
  synapse-data:
  synapse-no-presence-data:
  continuwuity-data:
