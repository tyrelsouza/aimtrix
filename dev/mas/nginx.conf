# The homeserver as clients see it on localhost:8013, like matrix.org:
# Synapse, except sign-on, sign-off and token refresh, which MAS answers
# (its compatibility layer for clients that don't use OAuth yet).
server {
    listen 8013;
    client_max_body_size 100M;

    location ~ ^/_matrix/client/(.*)/(login|logout|refresh) {
        proxy_pass http://mas:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://synapse-mas:8008;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
    }
}
