# Licenses allowed in the app, for `cargo about` (dev/third-party-licenses.mjs
# builds THIRD-PARTY-LICENSES.html from it). A crate under anything else
# fails the build: check it doesn't stop AIMtrix being MIT before adding it.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "0BSD",
    "CC0-1.0",
    "MIT-0",
    # File-level copyleft: fine unmodified (cssparser, eyeball, imbl…).
    "MPL-2.0",
    "OpenSSL",
]
# Only what the app ships, for the platforms it ships on.
ignore-dev-dependencies = true
ignore-build-dependencies = false
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# Crates whose license files cargo-about can't sort out on its own.
workarounds = ["ring", "rustls"]
