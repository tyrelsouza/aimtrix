[package]
name = "aimtrix"
version = "0.1.0"
description = "A Matrix client with an AIM-style interface"
authors = ["Tyrel Souza"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aimtrix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
matrix-sdk = "0.19"
keyring = "4"
rand = "0.10.3"
matrix-sdk-ui = "0.19"
base64 = "0.22"
eyeball-im = "0.9"
futures-util = "0.3"
tokio = { version = "1.54.1", features = ["macros", "sync", "time"] }
ammonia = "4.2.4"
tauri-plugin-dialog = "2"
matrix-sdk-crypto = { version = "0.19", default-features = false }
mime = "0.3"
mime_guess = "2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
arboard = { version = "3.7.0", default-features = false, features = ["image-data", "wayland-data-control"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Recovery passphrases go through 500,000 rounds of PBKDF2-SHA-512, which
# takes ~10 s per try unoptimized. Optimizing the hash crates makes dev
# builds and tests usable. (`cargo remove` deletes entries for crates that
# aren't direct dependencies; put them back if it does.)
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
# Same for making thumbnails of photos being sent.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3

[dev-dependencies]
hex = "0.4"
hmac = "0.12"
sha1 = "0.10"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
