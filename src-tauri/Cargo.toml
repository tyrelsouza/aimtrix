[package]
name = "aimtrix"
version = "0.1.0"
description = "A Matrix client with an AIM-style interface"
authors = ["Tyrel Souza"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aimtrix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
matrix-sdk = "0.19"
keyring = "4"
rand = "0.10.3"
matrix-sdk-ui = "0.19"
eyeball-im = "0.9"
futures-util = "0.3"
tokio = { version = "1.54.1", features = ["macros", "sync", "time"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
eyeball-im = "0.9"
futures-util = "0.3"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
